name: Deploy KingHost

# Publica site/ no servidor a cada push na main.
#
# Credenciais NAO ficam neste arquivo. Cadastre em
# Settings > Secrets and variables > Actions > Repository secrets:
#   FTP_USER      usuario de FTP
#   FTP_PASSWORD  senha
#
# Usa curl, e nao lftp nem a FTP-Deploy-Action. Este servidor responde
# "550 PWD: Permission denied": ele recusa informar o diretorio atual.
# lftp depende do PWD para ancorar caminho relativo e, sem resposta,
# passa a mandar "~/" literal — dai os 550 em ~/_preview, ~/www e /www.
# curl nao chama PWD: trabalha relativo ao diretorio de login, que nesta
# conta ja e a raiz web. O canal de dados em si esta saudavel (PASV
# negocia e transfere normalmente).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys simultaneos brigariam pelos mesmos arquivos no servidor.
concurrency:
  group: deploy-kinghost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O servidor manda so o certificado final e omite o intermediario
      # que o assina. O Windows resolve isso sozinho pela extensao AIA, o
      # OpenSSL nao — sem isto o curl do runner recusa a conexao.
      - name: Fecha a cadeia de certificados
        run: cat /etc/ssl/certs/ca-certificates.crt .github/kinghost-chain.pem > "$RUNNER_TEMP/ca-bundle.pem"

      - name: Envia site/ via FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # Credencial em arquivo com permissao restrita, e nao na linha
          # de comando: argumento de processo e visivel para qualquer
          # outro processo da maquina.
          umask 077
          printf 'machine web182.kinghost.net login %s password %s\n' \
            "$FTP_USER" "$FTP_PASSWORD" > "$RUNNER_TEMP/netrc"

          # web182.kinghost.net, e nao ftp.imb-brasil.com.br: o servidor
          # so apresenta certificado *.kinghost.net, entao conectar pelo
          # dominio da IMB falha na verificacao TLS. Mesmo servidor, mesma
          # conta. Se a KingHost migrar o plano, este nome muda —
          # conferir com: nslookup ftp.imb-brasil.com.br
          #
          # Destino _preview/ enquanto valida. No dia da virada, trocar
          # DEST para vazio para publicar na propria raiz web.
          #
          # --ssl-reqd aborta se o servidor nao oferecer TLS, em vez de
          # cair para FTP em texto limpo com a senha aberta.
          # --ftp-create-dirs cria a arvore de diretorios sozinho.
          # find -type f inclui ocultos, o que o .htaccess exige.
          #
          # Nada e apagado no servidor: ainda ha restos do site antigo la,
          # e a remocao e feita a mao, com autorizacao da IMB.
          DEST=_preview/

          cd site

          # Um processo curl para todos os arquivos, em vez de um por
          # arquivo. Hospedagem compartilhada limita conexoes FTP
          # simultaneas, e 219 logins (4 em paralelo) faziam o servidor
          # negar acesso — o erro 9 do curl cobre tanto CWD negado quanto
          # login negado, e era o segundo. Com arquivo de configuracao o
          # curl faz um login so e reaproveita a conexao.
          CFG="$RUNNER_TEMP/curl.cfg"
          : > "$CFG"
          find . -type f -printf '%P\n' | sort | while IFS= read -r f; do
            printf 'url = "ftp://web182.kinghost.net/%s%s"\nupload-file = "%s"\n' \
              "$DEST" "$f" "$f" >> "$CFG"
          done

          curl -sS --fail --ssl-reqd --ftp-create-dirs \
            --netrc-file "$RUNNER_TEMP/netrc" \
            --cacert "$RUNNER_TEMP/ca-bundle.pem" \
            --config "$CFG"

          echo "Enviados $(find . -type f | wc -l) arquivos para ${DEST:-raiz}"
