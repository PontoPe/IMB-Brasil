name: Deploy KingHost

# Publica site/ no servidor a cada push na main.
#
# Credenciais NAO ficam neste arquivo. Cadastre em
# Settings > Secrets and variables > Actions > Repository secrets:
#   FTP_USER      usuario de FTP
#   FTP_PASSWORD  senha
#
# Usa lftp e nao a FTP-Deploy-Action: naquele servidor a action nao
# consegue criar diretorio (falhava com "550 css: No such file or
# directory" mesmo com o diretorio pai existindo). lftp cria a arvore
# sozinho, sobe em paralelo e inclui arquivos ocultos — o .htaccess
# depende disso.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deploys simultaneos brigariam pelos mesmos arquivos no servidor.
concurrency:
  group: deploy-kinghost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # O servidor manda so o certificado final e omite o intermediario
      # que o assina. O Windows resolve isso sozinho pela AIA, o OpenSSL
      # nao — por isso o lftp acusava "certificate issuer is unknown".
      # Fechar a cadeia aqui permite manter a verificacao TLS ligada.
      - name: Fecha a cadeia de certificados
        run: cat /etc/ssl/certs/ca-certificates.crt .github/kinghost-chain.pem > "$RUNNER_TEMP/ca-bundle.pem"

      - name: Envia site/ via FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # web182.kinghost.net, e nao ftp.imb-brasil.com.br: o servidor
          # so apresenta certificado *.kinghost.net, entao conectar pelo
          # dominio da IMB falha na verificacao TLS. Mesmo servidor, mesma
          # conta. Se a KingHost migrar o plano, este nome muda —
          # conferir com: nslookup ftp.imb-brasil.com.br
          #
          # ssl-force + verify-certificate: sem isso o lftp aceitaria cair
          # para FTP em texto limpo, mandando a senha aberta na rede.
          #
          # A raiz web e /www. A raiz absoluta do FTP e o home da conta,
          # um nivel acima, onde o .ftpaccess nega escrita — era ali que
          # o lftp caia, resultando em "550 Permission denied".
          #
          # curl e lftp divergem aqui: em URL do curl o caminho e relativo
          # ao diretorio de login (que ja e /www), enquanto o lftp comeca
          # na raiz absoluta. Por isso o mesmo _preview existia para um e
          # nao para o outro. Com cd /www explicito os dois falam do mesmo
          # lugar.
          #
          # No dia da virada: trocar o destino do mirror de _preview/
          # para . (a propria /www).
          #
          # Sem --delete de proposito: o servidor ainda tem restos do site
          # antigo, e a remocao e feita a mao, com autorizacao da IMB.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ssl:ca-file $RUNNER_TEMP/ca-bundle.pem;
            set cmd:fail-exit false;
            debug 3;
            open -u '$FTP_USER','$FTP_PASSWORD' web182.kinghost.net;
            pwd;
            ls -la;
            cd www;
            pwd;
            ls -la;
          "
